apiVersion: researchcanvas.dev/agent-pipeline/v1alpha1
kind: DeclarativeAgentPipeline
version: 1

id: myc.pdf-canvas-agent.pipeline
name: PDF Canvas Agent semantic extraction pipeline
description: >-
  Declarative PDF semantic extraction harness. The host owns PDF access,
  credentials, model calls, job lifecycle, checkpointing, validation, and
  review-gated GraphPatch application. The plugin owns prompts, result
  schemas, pass ordering, and domain transformation rules.

input:
  type: application/pdf
  service: host.pdf.extract
  output:
    - structuredDocument
    - fullText
    - documentMap
  derivedServices:
    sectionText: host.pdf.section-text
    experimentParagraphs: host.pdf.experiment-paragraphs

# This is a native provider profile owned by this built-in plugin. The host
# still resolves credentials and performs the network calls, but the plugin
# declares the Kimi K2.6 request contract so generic model defaults cannot add
# incompatible fields.
nativeProvider:
  id: kimi-k2.6
  kind: kimi
  displayName: Kimi K2.6
  api:
    formatSettingId: api-format
    parsers:
      openai:
        format: openai-compatible
        baseUrls:
          china: https://api.moonshot.cn/v1
          international: https://api.moonshot.ai/v1
        chatPath: /chat/completions
        streamProtocol: openai-sse
      anthropic:
        format: anthropic-compatible
        baseUrls:
          china: https://api.moonshot.cn/anthropic
          international: https://api.moonshot.ai/anthropic
        chatPath: /v1/messages
        streamProtocol: anthropic-sse
    baseUrlSource: plugin-setting
    baseUrlSettingId: api-url
    credential:
      settingId: api-key
      environmentVariable: MOONSHOT_API_KEY
  defaults:
    model: kimi-k2.6
    apiFormat: openai
    pdfTransport: local-text
    thinking: enabled
    publicProgress: disabled
  requestPolicy:
    thinking:
      settingId: thinking
      requestPath: thinking.type
      values:
        enabled: enabled
        disabled: disabled
    reasoning:
      mode: omit
      fields:
        - reasoning_effort
    sampling:
      mode: omit
      fields:
        - temperature
        - top_p
        - n
        - presence_penalty
        - frequency_penalty
    completion:
      stream: true
      maxTokens:
        openai: omit
        anthropic: 32768
      publicProgress:
        settingId: public-progress
        framing: myc-progress-v1
        source: assistant-content
        hiddenThinkingSource: never
    pdfInput:
      mode: kimi-files
      purpose: file-extract
      modelReceives: extracted-text
      modelReceivesPdfBytes: false
      upload:
        method: POST
        path: /files
        multipartField: file
        contentType: application/pdf
      content:
        method: GET
        pathTemplate: /files/{file_id}/content
      cleanup:
        method: DELETE
        pathTemplate: /files/{file_id}

modelSlots:
  - id: extraction
    label: Extraction model
    required: true
    capabilities:
      - text
      - structured-output
    configuration:
      provider:
        source: plugin-native-provider
        profileId: kimi-k2.6
      credential:
        source: host-secret-setting
        settingId: api-key
      model:
        source: plugin-setting
        settingId: model
      thinking:
        source: plugin-setting
        settingId: thinking
      providerProfile: kimi-k2.6

  - id: synthesis
    label: Synthesis model
    required: true
    capabilities:
      - text
      - structured-output
      - long-context
    configuration:
      provider:
        source: plugin-native-provider
        profileId: kimi-k2.6
      credential:
        source: host-secret-setting
        settingId: api-key
      model:
        source: plugin-setting
        settingId: model
      thinking:
        source: plugin-setting
        settingId: thinking
      providerProfile: kimi-k2.6

  - id: recovery
    label: Recovery model
    required: false
    capabilities:
      - text
      - structured-output
    configuration:
      provider:
        source: plugin-native-provider
        profileId: kimi-k2.6
      credential:
        source: host-secret-setting
        settingId: api-key
      model:
        source: plugin-setting
        settingId: model
      thinking:
        source: plugin-setting
        settingId: thinking
      providerProfile: kimi-k2.6

stages:
  - id: pass-a-structure
    pass: A
    name: structure-extraction
    type: model
    modelSlot: extraction
    dependsOn: []
    parallelGroup: local-extraction
    prompt: prompts/pass-a-structure.yaml
    outputSchema: schemas/pass-a-structure.schema.json
    inputBindings:
      document_structure: input.structuredDocument
      full_text: input.fullText

  - id: pass-b-entities-v4
    pass: B
    name: entity-extraction-v4
    type: model-map
    modelSlot: extraction
    dependsOn: []
    parallelGroup: local-extraction
    mapOver: input.structuredDocument.sections
    prompt: prompts/pass-b-v4.yaml
    outputSchema: schemas/pass-b-v4.schema.json
    extractionContract: myc.llm.v4
    inputBindings:
      document_structure: input.structuredDocument
      section_title: item.title
      section_text: input.derivedServices.sectionText(item.id)

  - id: pass-e-synthesis-v4
    pass: E
    name: synthesis-v4
    type: model
    modelSlot: synthesis
    dependsOn:
      - pass-a-structure
      - pass-b-entities-v4
    prompt: prompts/pass-e-v4.yaml
    outputSchema: schemas/pass-e-v4.schema.json
    extractionContract: myc.llm.v4
    inputBindings:
      title: stages.pass-a-structure.output.title
      authors: stages.pass-a-structure.output.authors
      pass_a_structure_json: stages.pass-a-structure.output
      pass_b_fragments_json: stages.pass-b-entities-v4.output
      full_text: input.fullText

  - id: pass-f-compile-and-transform
    pass: F
    name: host-bus-compile-and-graph-patch-transform
    type: host-transform
    runtime: host.host-bus
    dependsOn:
      - pass-e-synthesis-v4
    inputSchema: schemas/pass-e-v4.schema.json
    outputSchema: schemas/graph-patch.schema.json
    inputBindings:
      extraction: stages.pass-e-synthesis-v4.output
    operations:
      - validate-extraction
      - bus.graph.ir.compile
      - bus.graph.storage.put
      - bus.event.publish
      - build-review-gated-graph-patch
    outputPolicy:
      type: graph-patch
      reviewRequired: true
      apiVersion: researchcanvas.dev/graph-patch/v1alpha1

failurePolicy:
  modelRetries: 2
  recoverySlot: recovery
  onTruncatedJson: recover-then-validate
  onPassFailure: retain-partial-results-and-mark-incomplete
  requireReviewBeforeApply: true

localization:
  default: en
  supported:
    - en
    - zh
