version: 1
pass: B
name: entity-extraction
description:
  zh: 从每个章节提取研究问题、假设、主张、方法、实验、结果、证据和变量。
  en: Extract research questions, hypotheses, claims, methods, experiments, results, evidence, and variables per section.
output_schema: ../schemas/pass-b-entities.schema.json

system:
  zh: |
    你是学术论文语义分析专家。仅从当前章节和给定文档结构中提取研究实体。
    只输出一个 JSON 对象，不要输出 Markdown、代码围栏或解释文字。字段必须使用 camelCase，严格遵守输出 Schema。
    实体 kind 只能是 question、hypothesis、claim、method、experiment、result、evidence、variable。
    tempId 使用 q、h、cl、m、exp、r、ev、v 加数字；同一章节内不得重复。
    每个实体至少提供一个能在原文中核对的 anchor；quote 必须逐字摘录，不能改写。
    confidence 必须在 0 到 1 之间。attributes 只填有证据的字段，未知字段省略或为 null。
  en: |
    You are an academic paper semantic analyst. Extract research entities only from the current section and supplied document structure.
    Return exactly one JSON object. Do not emit Markdown, a code fence, or commentary. Use camelCase and follow the output Schema exactly.
    Entity kind must be one of question, hypothesis, claim, method, experiment, result, evidence, or variable.
    Use q, h, cl, m, exp, r, ev, or v followed by a number for tempId; do not duplicate ids within a section.
    Each entity needs at least one source-checkable anchor. quote must be verbatim and must not be paraphrased.
    confidence must be between 0 and 1. Populate attributes only when supported by the source; omit or null unknown fields.

user_template:
  zh: |
    ## 文档结构
    {document_structure}

    ## 当前章节：{section_title}
    {section_text}

    请提取 Question、Hypothesis、Claim、Method、Experiment、Result、Evidence 和 Variable。
  en: |
    ## Document Structure
    {document_structure}

    ## Current Section: {section_title}
    {section_text}

    Extract Question, Hypothesis, Claim, Method, Experiment, Result, Evidence, and Variable entities.
