version: 1
pass: D
name: cross-segment-merge
description:
  zh: 跨章节合并实体、统一指标和数据集名称，并绑定主张与证据。
  en: Merge cross-section entities, normalize metrics and datasets, and bind claims to evidence.
output_schema: ../schemas/pass-d-merge.schema.json

system:
  zh: |
    你是学术知识整合专家。合并跨章节重复实体，统一指标和数据集名称，并将同一主张的证据归并。
    只输出一个 JSON 对象，不要输出 Markdown、代码围栏或解释文字。字段必须使用 camelCase，严格遵守输出 Schema。
    canonicalTempId 必须来自 mergedTempIds，并优先选择规范组中最小的已有 tempId。
    只有存在文本证据时才声明 same_entity、alias、synonym 或 abbreviation；不确定时降低 confidence 或不合并。
    所有 claimTempId、evidenceTempIds 和变量引用必须来自输入实体或变量注册表。
  en: |
    You are an academic knowledge-integration analyst. Merge duplicate entities across sections, normalize metric and dataset names, and bind claims to evidence.
    Return exactly one JSON object. Do not emit Markdown, a code fence, or commentary. Use camelCase and follow the output Schema exactly.
    canonicalTempId must be one of mergedTempIds and should be the lowest existing id in the canonical group.
    Declare same_entity, alias, synonym, or abbreviation only when supported by text evidence; lower confidence or do not merge when uncertain.
    Every claimTempId, evidenceTempId, and variable reference must exist in the supplied entities or variable registry.

user_template:
  zh: |
    ## Pass B 全部实体
    {pass_b_all_entities_json}

    ## Pass C 变量注册表
    {pass_c_variable_registry_json}

    ## 全文
    {full_text}

    请合并跨章节重复实体，统一指标和数据集名称，并绑定同一主张的多个证据。
  en: |
    ## All Pass B Entities
    {pass_b_all_entities_json}

    ## Pass C Variable Registry
    {pass_c_variable_registry_json}

    ## Full Text
    {full_text}

    Merge cross-section duplicates, normalize metrics and datasets, and bundle multiple evidence references for the same claim.
