version: 1
defaultLocale: en
schema: myc.llm.v4
passes:
  - pass: A
    name: structure-extraction
    file: pass-a-structure.yaml
    description:
      en: Document structure extraction
    inputSchema:
      document_structure: StructuredDocument JSON
      full_text: Full extracted text
    outputSchema: ../schemas/pass-a-structure.schema.json
  - pass: B
    name: entity-extraction-v4
    file: pass-b-v4.yaml
    description:
      en: Per-section myc.llm.v4 fragment extraction
    inputSchema:
      document_structure: StructuredDocument JSON
      section_title: string
      section_text: string
    outputSchema: ../schemas/pass-b-v4.schema.json
  - pass: E
    name: synthesis-v4
    file: pass-e-v4.yaml
    description:
      en: Paper-level synthesis into one myc.llm.v4 ExtractionV3 root
    inputSchema:
      title: string
      authors: string
      pass_a_structure_json: string
      pass_b_fragments_json: string
      full_text: string
    outputSchema: ../schemas/pass-e-v4.schema.json
