apiVersion: researchcanvas.dev/v1alpha1
kind: AgentPlugin
metadata:
  id: myc.pdf-canvas-agent
  name: PDF Canvas Agent
  version: 0.2.0
  publisher: Research Canvas
  developer: Agent Platform Team
  developerId: 8bca4aed-e0ab-43c5-89ee-e2bcaf7f0e31
  update:
    latestVersion: 0.2.0
    releaseNotes: Added host-managed API key, model, and thinking settings.
  description: >
    从 PDF 论文中提取 DocumentMap → 语义结构 → 审阅门控的 GraphPatch。
    Agent 不持有 API Key、文件系统句柄、网络访问、Graph store 写权限。
    宿主管理一切，Agent 输出只能进入 reviewRequired GraphPatch。
  license: MIT
spec:
  engine: host-mediated
  entry: agent-manifest.json
  capabilities:
    - agent.pdf.read
    - agent.graph.patch.propose
    - agent.review.request
  permissions: []
  settings:
    - id: api-key
      label: Provider API key
      type: text
      secret: true
      required: true
      placeholder: Enter your provider API key
      group: model
    - id: model
      label: Model
      type: text
      required: true
      default: luna
      placeholder: luna
      group: model
    - id: thinking
      label: Thinking
      type: select
      required: true
      default: extra_high
      group: model
      options:
        - value: low
          label: Low
        - value: medium
          label: Medium
        - value: high
          label: High
        - value: extra_high
          label: Extra high
