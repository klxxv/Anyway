apiVersion: researchcanvas.dev/v1alpha1
kind: LocalePlugin
metadata:
  id: researchcanvas.i18n-ja
  name: Japanese UI
  version: 1.0.1
  publisher: Research Canvas Community
  developer: Localization Example Team
  description: Demonstrates community-provided interface translations without adding languages to the host bundle.
  license: MIT
spec:
  engine: declarative
  entry: locales/ja-JP.json
  capabilities:
    - i18n.register
  permissions: []
  contributes:
    locales:
      - locale: ja-JP
        name: 日本語
        path: locales/ja-JP.json
