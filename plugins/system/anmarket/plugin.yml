apiVersion: researchcanvas.dev/v1alpha1
kind: SystemPlugin
metadata:
  id: anyway.anmarket
  name: AnMarket
  version: 0.1.0
  publisher: Anyway Core Team
  developer: Anyway Core Team
  description: Official supply-chain registry, analysis, reputation, policy, and update coordinator.
  license: MIT
spec:
  runtime: ancordis
  entry: index.ts
  trustClass: official-system
  capabilities:
    - registry.provider
    - supplychain.analyzer
    - supplychain.reputation
    - supplychain.policy-advisor
    - vue-ir.contribute
  permissions: []
  contributes:
    services:
      - RegistryProvider
      - AnalyzerProvider
      - ReputationProvider
      - PolicyAdvisor
    vueIrSlots:
      - market.registry
      - market.install
      - market.scan-report
      - market.update-history
  security:
    kernelEnforced:
      - trust-root
      - subject-hash
      - signature-verification
      - quarantine-install
      - permission-grant
      - atomic-activation
      - rollback
    providerRestrictions:
      analyzerInput: read-only-BlobRef
      analyzerCanInstall: false
      analyzerCanApprove: false
      policyAdvisorCanGrant: false
