[package]
name = "research-graph-compiler"
version = "0.1.0"
edition = "2021"
description = "Research Canvas graph compiler semantic kernel: canonicalization, dual hashing, invariant checks, and the compile pipeline"
license = "AGPL-3.0"
authors = ["Research Canvas Contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1.25"
