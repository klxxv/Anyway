[package]
name = "semantic-pipeline"
version = "0.1.0"
edition = "2021"
description = "Multi-stage semantic extraction pipeline (Pass A–F) for academic PDF papers"
license = "AGPL-3.0"
authors = ["Research Canvas Contributors"]

[dependencies]
async-trait = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
