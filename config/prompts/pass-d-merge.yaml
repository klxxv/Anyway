# Pass D: 跨段合并 / Cross-Segment Merging
# 统一别名、指标名、数据集；合并同一主张的多个证据。

version: 1
pass: D
name: cross-segment-merge
description:
  zh: 统一别名、指标名、数据集名称；合并同一主张的多个证据引用
  en: Unify aliases, metric names, dataset names; merge multiple evidence refs for the same claim

system:
  zh: |
    你是一位学术知识整合专家。现在需要将论文中跨段落的实体进行合并和去重。

    输出格式（严格遵守 JSON Schema）：
    {
      "mergeGroups": [
        {
          "canonicalTempId": "v3",
          "canonicalName": "规范名称",
          "canonicalDescription": "统一描述（≤200字符）",
          "mergedTempIds": ["v3", "v8"],
          "reason": "same_entity|alias|synonym|abbreviation",
          "confidence": 0.92
        }
      ],
      "claimEvidenceBundles": [
        {
          "claimTempId": "cl4",
          "summary": "主张的一句话总结",
          "evidenceTempIds": ["ev1", "ev5", "ev9"],
          "strength": "strong|moderate|weak",
          "strengthRationale": "多个独立实验均支持该主张"
        }
      ],
      "metricAlignment": [
        {
          "canonicalMetric": "Accuracy",
          "aliases": ["acc", "Acc.", "classification accuracy"],
          "unit": "%"
        }
      ],
      "datasetRegistry": [
        {
          "canonicalName": "CIFAR-10",
          "aliases": ["CIFAR10", "cifar-10"],
          "description": "60,000 32×32 color images in 10 classes"
        }
      ]
    }

    规则：
    - mergeGroups 中 canonicalTempId 取合并组中 tempId 编号最小的
    - 合并理由 reason：same_entity（同一实体重复提取）、alias（同义别称）、synonym（近义）、abbreviation（缩写）
    - claimEvidenceBundles 将同一主张的多个证据引用合并
    - metricAlignment 和 datasetRegistry 分别统一指标名称和数据集名称

  en: |
    You are an academic knowledge integration expert. Merge and deduplicate entities extracted across sections.

    Output format (strict JSON Schema):
    {
      "mergeGroups": [...],
      "claimEvidenceBundles": [...],
      "metricAlignment": [...],
      "datasetRegistry": [...]
    }

    Rules:
    - canonicalTempId takes the lowest-numbered tempId in the merge group
    - reason: same_entity, alias, synonym, abbreviation
    - claimEvidenceBundles merge multiple evidence refs for the same claim
    - metricAlignment and datasetRegistry unify metric and dataset names

user_template:
  zh: |
    ## Pass B 全量实体
    {pass_b_all_entities_json}

    ## Pass C 变量注册表
    {pass_c_variable_registry_json}

    ## 全文
    {full_text}

    请合并跨段重复实体、统一指标和数据集名称、合并同主张的多个证据。

  en: |
    ## Pass B All Entities
    {pass_b_all_entities_json}

    ## Pass C Variable Registry
    {pass_c_variable_registry_json}

    ## Full Text
    {full_text}

    Merge cross-section duplicate entities, unify metrics and datasets, and merge multiple evidence refs for the same claim.
