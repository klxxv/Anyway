# Prompt 模板配置清单 / Prompt Template Manifest
# 语义提取管线各阶段的 prompt 模板索引。
#
# 语言键：zh（简体中文）、en（English）
# 缺省回退顺序：指定语言 → en → 第一个可用语言

version: 1
defaultLocale: en
passes:
  - pass: A
    name: structure-extraction
    file: pass-a-structure.yaml
    description:
      zh: 文档结构提取
      en: Document structure extraction
    inputSchema:
      document_structure: "StructuredDocument JSON"
      full_text: "Full extracted text"
    outputSchema:
      title: string
      authors: string[]
      abstract: string
      sections: Section[]
      references: Reference[]
      meta: Meta

  - pass: B
    name: entity-extraction
    file: pass-b-entities.yaml
    description:
      zh: 局部实体提取
      en: Local entity extraction
    inputSchema:
      document_structure: "StructuredDocument JSON"
      section_title: string
      section_text: string
    outputSchema:
      entities: ExtractedEntity[]
      meta: Meta

  - pass: C
    name: variable-fission
    file: pass-c-variable-fission.yaml
    description:
      zh: 变量裂变与实验矩阵
      en: Variable fission & experiment matrix
    inputSchema:
      pass_b_entities_json: string
      experiment_paragraphs: string
      full_text: string
    outputSchema:
      experimentMatrix: ExperimentMatrix[]
      variableRegistry: VariableRegistry[]

  - pass: D
    name: cross-segment-merge
    file: pass-d-merge.yaml
    description:
      zh: 跨段合并
      en: Cross-segment merging
    inputSchema:
      pass_b_all_entities_json: string
      pass_c_variable_registry_json: string
      full_text: string
    outputSchema:
      mergeGroups: MergeGroup[]
      claimEvidenceBundles: ClaimEvidenceBundle[]
      metricAlignment: MetricAlignment[]
      datasetRegistry: DatasetRegistry[]

  - pass: E
    name: paper-level-synthesis
    file: pass-e-synthesis.yaml
    description:
      zh: 论文级综合
      en: Paper-level synthesis
    inputSchema:
      title: string
      authors: string
      pass_a_structure_json: string
      merged_entities_json: string
      pass_c_experiment_matrix_json: string
      pass_d_merge_json: string
      full_text: string
    outputSchema:
      mainConclusions: MainConclusion[]
      ablationAnalysis: AblationAnalysis[]
      interactionEffects: InteractionEffect[]
      confounders: Confounder[]
      missingControls: MissingControl[]
      internalConflicts: InternalConflict[]
      synthesisSummary: string
