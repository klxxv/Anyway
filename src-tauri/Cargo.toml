[package]
name = "research-canvas-desktop"
version = "0.1.0"
description = "Human-led research graph and ablation planning workspace"
authors = ["Research Canvas Contributors"]
edition = "2021"

[lib]
name = "research_canvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
zip = { version = "2", default-features = false, features = ["deflate"] }
