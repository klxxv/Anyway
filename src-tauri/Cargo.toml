[package]
name = "research-canvas-desktop"
version = "0.3.5"
description = "Human-led research graph and ablation planning workspace"
authors = ["Research Canvas Contributors"]
edition = "2021"

[lib]
name = "research_canvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lopdf = "0.34"
regex = "1"
graphpatch-gen = { path = "../crates/graphpatch-gen" }
research-graph-compiler = { path = "../crates/research-graph-compiler" }
semantic-pipeline = { path = "../crates/semantic-pipeline" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
curve25519-dalek = "4"
sha2 = "0.10"
async-trait = "0.1"
tauri = { version = "2", features = [] }
thiserror = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time"] }
unicode-normalization = "0.1.25"
wasmi = "0.31"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_Pointer",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
wat = "1"
