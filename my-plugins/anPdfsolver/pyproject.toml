[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anpdfsolver"
version = "0.5.3"
description = "Plugin-owned direct-provider Python worker for anPdfsolver"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
anpdfsolver-worker = "anpdfsolver.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
